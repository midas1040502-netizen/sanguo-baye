/* ==================== 回合流程 ==================== */
function endTurn(){
  if (state.over) return;

  // 1. 收入結算（依難度調整、並受 1000 上限）
  const dc = diffCfg();
  Object.keys(FACTIONS).forEach(f=>{
    if (f === 'none' || isDead(f)) return;
    const inc = incomeFor(f);
    const t = state.treasury[f];
    t.gold = clamp(t.gold + inc.gold, 0, RES_CAP);
    t.food = clamp(t.food + inc.food, 0, RES_CAP);
    applyStarvation(f);
  });
  const inc = incomeFor(state.player);
  addLog('歲入：金 +' + inc.gold + '　糧 ' + (inc.food>=0?'+':'') + inc.food +
         '（上限 ' + RES_CAP + '）', '');

  // 2. 外族同盟貢品
  applyTribeBonus();

  // 3. 隨機事件
  randomEvent();

  // 4. AI 行動
  aiTurn();

  // 5. 行軍：在途部隊推進，抵達者交戰／駐防
  stepMarches();

  // 6. 新回合
  state.turn++;
  CITY_DEFS.forEach(d=>{
    const c = state.cities[d.id];
    c.acted = false; c.moved = false;
  });
  addLog('', 'turn');

  checkGameOver();
  refresh();
}

function incomeFor(f){
  const dc = diffCfg();
  let gold = 0, food = 0, troops = 0;
  factionCities(f).forEach(id=>{
    const c = state.cities[id];
    const loyMul = 0.6 + c.loy / 250;
    gold += c.comm * 2.0 * loyMul;
    food += c.agri * 1.5 * loyMul;
    troops += c.troops;
  });
  (state.marches || []).forEach(m=>{ if (m.owner === f) troops += m.troops; });
  food -= troops / 200;
  const mul = (f === state.player) ? dc.playerInc : dc.aiInc;
  return {gold: Math.round(gold * mul), food: Math.round(food * mul)};
}

/* 外族同盟：每季貢品／援軍 */
function applyTribeBonus(){
  const p = state.player;
  const t = state.treasury[p];
  if (!t) return;
  const myCities = factionCities(p);
  TTRIBE_KEYS.forEach(k=>{
    const tb = state.tribes[k];
    if (!tb.ally) return;
    const def = TRIBES[k];
    const roll = Math.random();
    if (def.bonus === 'gold'){
      const g = rint(90, 170);
      t.gold = clamp(t.gold + g, 0, RES_CAP);
      addLog(def.name + ' 遣使納貢，金 +' + g, 'good');
    } else if (def.bonus === 'cav'){
      if (myCities.length && roll < 0.6){
        const cid = myCities[rint(0, myCities.length - 1)];
        const c = state.cities[cid];
        const add = rint(1200, 2600);
        const cnt = mixCounts(c.mix, c.troops);
        c.troops += add;
        // 援軍偏騎
        const cur = normMix(c.mix);
        cur.cav = clamp(cur.cav + add / (c.troops + 1) * 0.6, 0, 0.6);
        c.mix = normMix(cur);
        addLog(def.name + ' 獻騎兵 ' + fmtT(add) + ' 於 ' + CITY_BY_ID[cid].name, 'good');
      }
    } else if (def.bonus === 'troop'){
      if (myCities.length && roll < 0.6){
        const cid = myCities[rint(0, myCities.length - 1)];
        const add = rint(1000, 2200);
        state.cities[cid].troops += add;
        addLog(def.name + ' 遣勇士 ' + fmtT(add) + ' 相助於 ' + CITY_BY_ID[cid].name, 'good');
      }
    } else if (def.bonus === 'atk'){
      tb.seasonal = (tb.seasonal || 0) + 1;   // 於出征結算時讀取
    } else if (def.bonus === 'def'){
      tb.seasonal = (tb.seasonal || 0) + 1;
    }
  });
}

// 缺糧：軍隊逃散
function applyStarvation(f){
  const t = state.treasury[f];
  if (t.food >= 0) return;
  const list = factionCities(f);
  let lost = 0;
  list.forEach(id=>{
    const c = state.cities[id];
    const d = Math.round(c.troops * 0.06);
    c.troops = Math.max(0, c.troops - d);
    lost += d;
  });
  t.food = 0;
  if (f === state.player) addLog('糧盡！軍中逃散 ' + fmtT(lost) + ' 人', 'bad');
}

function randomEvent(){
  if (Math.random() > 0.38) return;
  const myCities = factionCities(state.player);
  if (!myCities.length) return;
  const cid = myCities[rint(0, myCities.length - 1)];
  const c = state.cities[cid];
  const name = CITY_BY_ID[cid].name;
  const roll = rint(1, 6);

  if (roll === 1){
    const g = rint(120, 260);
    state.treasury[state.player].food += g;
    addLog(name + ' 五穀豐登，糧 +' + g, 'good');
  } else if (roll === 2){
    const g = rint(100, 220);
    state.treasury[state.player].food = Math.max(0, state.treasury[state.player].food - g);
    addLog(name + ' 蝗災為患，糧 -' + g, 'bad');
  } else if (roll === 3){
    c.loy = clamp(c.loy - rint(6, 12), 0, 100);
    addLog(name + ' 民變四起，民忠下降', 'bad');
  } else if (roll === 4){
    const g = rint(100, 200);
    state.treasury[state.player].gold += g;
    addLog(name + ' 商賈雲集，金 +' + g, 'good');
  } else if (roll === 5){
    const loss = Math.round(c.troops * rnd(0.04, 0.09));
    c.troops = Math.max(0, c.troops - loss);
    addLog(name + ' 軍中疫病，折兵 ' + loss, 'bad');
  } else {
    c.loy = clamp(c.loy + rint(4, 8), 0, 100);
    addLog(name + ' 風調雨順，民心歸附', 'good');
  }
}

/* ==================== AI ==================== */
function aiTurn(){
  Object.keys(FACTIONS).forEach(f=>{
    if (f === 'none' || f === state.player || isDead(f)) return;

    // 內政
    factionCities(f).forEach(cid=>{
      if (Math.random() < 0.7) aiDevelop(cid, f);
    });

    // 兵力集結：內地城池把兵送往前線
    for (let k = 0; k < 3; k++){
      let any = false;
      factionCities(f).forEach(cid=>{
        const c = state.cities[cid];
        if (c.moved || c.troops < 7000) return;
        const adj = CITY_BY_ID[cid].adj;
        const hostile = adj.some(id=>{
          const o = state.cities[id].owner;
          return o !== f && (o === 'none' || state.rel[f][o] < 75);
        });
        if (hostile) return;
        const friend = adj.find(id=> state.cities[id].owner === f && !state.cities[id].moved);
        if (!friend) return;
        const n = Math.round((c.troops - 2000) * 0.85);
        if (n < 2000) return;
        c.troops -= n;
        state.cities[friend].troops += n;
        c.moved = true;
        any = true;
      });
      if (!any) break;
    }

    // 出征（大軍開拔，MARCH_TURNS 季後抵達交戰）
    let guard = 0;
    while (guard++ < 2){
      const mv = findAiAttack(f);
      if (!mv) break;
      const from = state.cities[mv.from];
      if (from.troops < mv.troops) break;
      createMarch(mv.from, mv.to, mv.gen, mv.troops, mv.mix);
    }
  });
}

function aiDevelop(cid, f){
  const c = state.cities[cid];
  const t = state.treasury[f];
  if (c.acted) return;
  const dc = diffCfg();
  const opts = [];
  if (t.gold >= 120 && t.food > 150 && c.troops < 28000 * dc.aiRecruit){ opts.push('recruit'); opts.push('recruit'); opts.push('recruit'); }
  if (t.gold >= 100 && c.def < 85) opts.push('fortify');
  if (t.gold >= 80) { opts.push('develop'); opts.push('commerce'); }
  if (t.gold >= 60 && c.loy < 70) opts.push('appease');
  if (!opts.length) return;

  const pick = opts[rint(0, opts.length - 1)];
  if (pick === 'recruit'){
    t.gold -= 120;
    c.troops += Math.round(3000 * dc.aiRecruit);
    c.loy = clamp(c.loy - 4, 0, 100);
  } else if (pick === 'fortify'){
    t.gold -= 100; c.def = clamp(c.def + rint(3,6), 0, 100);
  } else if (pick === 'develop'){
    t.gold -= 80; c.agri = clamp(c.agri + rint(4,7), 0, 100);
  } else if (pick === 'commerce'){
    t.gold -= 80; c.comm = clamp(c.comm + rint(4,7), 0, 100);
  } else {
    t.gold -= 60; c.loy = clamp(c.loy + rint(5,9), 0, 100);
  }
  c.acted = true;
}

function findAiAttack(f){
  let best = null;
  factionCities(f).forEach(fromId=>{
    const from = state.cities[fromId];
    if (from.moved || from.troops < 6000) return;
    const adj = CITY_BY_ID[fromId].adj;
    adj.forEach(toId=>{
      const to = state.cities[toId];
      if (to.owner === f) return;
      if (state.rel[f][to.owner] >= 75) return; // 盟友不攻
      if (to.owner === state.player && state.rel[f][state.player] >= 75) return;
      const avail = from.troops - 1500;
      if (avail < 4000) return;
      /* AI 也會依敵方編制挑相剋兵種，並據此調整出兵門檻（難度→積極度） */
      const mix = aiAttackMix(fromId, toId);
      const cAdv = counterBonus(mix, normMix(to.mix));
      const need = to.troops * (1.65 + to.def / 320) / clamp(cAdv, 0.85, 1.34) / diffCfg().aiAttack;
      if (avail < need) return;
      const gen = bestGeneralIn(fromId);
      if (!gen) return;
      const score = avail - need;
      if (!best || score > best.score){
        best = {from: fromId, to: toId, gen: gen.id,
                troops: Math.round(avail * 0.9), mix, score};
      }
    });
  });
  return best;
}

/* AI 出兵編制：本勢力習慣 + 針對守軍的反制 */
function aiAttackMix(fromId, toId){
  const base = normMix(state.cities[fromId].mix);
  const cm = counterMix(state.cities[toId].mix);
  const w = {};
  TKEYS.forEach(k=> w[k] = base[k] * 0.45 + cm[k] * 0.55);
  return normMix(w);
}

/* ==================== 勝負 ==================== */
function checkGameOver(){
  const p = state.player;
  if (isDead(p)){
    state.over = true;
    showEnd('失　勢', '城池盡失，霸業成空。', false);
    return;
  }
  const alive = Object.keys(FACTIONS).filter(f=> f !== 'none' && !isDead(f));
  const notMine = CITY_DEFS.filter(d=> state.cities[d.id].owner !== p).length;
  if (notMine === 0){
    state.over = true;
    showEnd('天　下', '四海歸一，霸業已成。', true);
  } else if (alive.length === 1 && alive[0] === p){
    state.over = true;
    showEnd('天　下', '群雄盡滅，天下已定。', true);
  }
}

/* ==================== 事件綁定 ==================== */
document.addEventListener('click', function(e){
  /* 點擊遮罩空白處關閉（僅限可關閉的彈窗） */
  if (e.target.classList && e.target.classList.contains('mask')){
    if (e.target.getAttribute('data-dismiss') === '1')
      document.getElementById('modalRoot').innerHTML = '';
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act !== 'closemask' && act !== 'mixpreset') AudioSys.click();

  if (act === 'pick'){
    sel = el.getAttribute('data-id');
    tab = 'city';
    document.querySelectorAll('.tabs button').forEach(b=> b.classList.remove('on'));
    document.querySelector('.tabs button[data-tab="city"]').classList.add('on');
    refresh();
    return;
  }

  if (act === 'start'){
    startGame(el.getAttribute('data-f'));
    return;
  }

  /* 難度選擇 */
  if (act === 'diff'){
    difficulty = el.getAttribute('data-d');
    document.querySelectorAll('.diff-chip').forEach(c=> c.classList.remove('on'));
    el.classList.add('on');
    AudioSys.click();
    return;
  }

  /* 自建勢力面板 */
  if (act === 'opencustom'){
    document.getElementById('customWrap').classList.add('on');
    document.getElementById('factionList').style.display = 'none';
    const self = document.querySelector('[data-act="opencustom"]');
    if (self) self.style.display = 'none';
    AudioSys.click();
    return;
  }
  if (act === 'cancelcustom'){
    document.getElementById('customWrap').classList.remove('on');
    document.getElementById('factionList').style.display = '';
    const self = document.querySelector('[data-act="opencustom"]');
    if (self) self.style.display = '';
    AudioSys.click();
    return;
  }
  if (act === 'pickcolor'){
    document.querySelectorAll('#cfColorBox .color-opt').forEach(c=> c.classList.remove('on'));
    el.classList.add('on');
    AudioSys.click();
    return;
  }
  if (act === 'confirmcustom'){
    const name = (document.getElementById('cfName').value || '').trim() || '大漢';
    const lord = (document.getElementById('cfLord').value || '').trim() || '主公';
    const colEl = document.querySelector('#cfColorBox .color-opt.on');
    const color = colEl ? colEl.getAttribute('data-c') : '#2f6fb3';
    const city = document.getElementById('cfCity').value;
    const base = document.getElementById('cfBase').value;
    if (!city) return toast('請選擇起始城');
    customFaction = {name: name, lord: lord, color: color, base: base, city: city};
    startGame('player', customFaction);
    return;
  }

  if (act === 'tab'){
    tab = el.getAttribute('data-tab');
    document.querySelectorAll('.tabs button').forEach(b=> b.classList.remove('on'));
    el.classList.add('on');
    renderSide();
    return;
  }

  if (act === 'endturn'){ endTurn(); return; }

  if (['develop','commerce','fortify','recruit','appease','drill'].indexOf(act) >= 0){
    doAction(act);
    return;
  }

  if (act === 'attack'){ openAttackModal(sel); return; }
  if (act === 'attack-from-adj'){ openAttackFromAdjacent(sel); return; }
  if (act === 'transfer'){ openTransferModal(sel); return; }
  if (act === 'reform'){ openReformModal(sel); return; }

  if (act === 'mixpreset'){
    const root = document.getElementById('mixEditor');
    if (!root) return;
    const p = el.getAttribute('data-p');
    let mix;
    if (p === 'counter'){
      const tsel = document.getElementById('atkTarget');
      mix = tsel ? counterMix(state.cities[tsel.value].mix) : MIX_PRESETS.even;
    } else {
      mix = MIX_PRESETS[p] || MIX_PRESETS.even;
    }
    writeMixInputs(root, normMix(mix));
    if (mixMode === 'reform'){
      const c = state.cities[sel];
      const m = normMix(readMixInputs(root));
      paintMixLabels('rf', m, c ? c.troops : null);
      const pv = document.getElementById('rfPreview');
      if (pv && c) pv.innerHTML = mixBarHTML(m, c.troops);
    } else if (atkUpdate) atkUpdate();
    return;
  }

  if (act === 'confirmreform'){
    const cid = el.getAttribute('data-from');
    const root = document.getElementById('mixEditor');
    const c = state.cities[cid];
    if (!c || !root || c.acted) { document.getElementById('modalRoot').innerHTML = ''; return; }
    const m = normMix(readMixInputs(root));
    document.getElementById('modalRoot').innerHTML = '';
    c.mix = m;
    c.acted = true;
    addLog(CITY_BY_ID[cid].name + ' 整編守軍：' + mixLine(m, c.troops), '');
    refresh();
    return;
  }
  if (act === 'confirmtransfer'){
    const fromId = el.getAttribute('data-from');
    const toId = document.getElementById('trTarget').value;
    const n = Number(document.getElementById('trTroops').value);
    document.getElementById('modalRoot').innerHTML = '';
    const from = state.cities[fromId];
    if (n > from.troops - 1000) return toast('兵力不足');
    from.troops -= n;
    state.cities[toId].troops += n;
    from.moved = true;
    Map3D.spawnFx({type:'transfer', from:fromId, to:toId,
                   color: FACTIONS[from.owner].color, name:'輜重',
                   t:0, dur:2.6, seed:Math.random() * 6});
    addLog('自 ' + CITY_BY_ID[fromId].name + ' 調兵 ' + fmtT(n) + ' 至 ' + CITY_BY_ID[toId].name, '');
    refresh();
    return;
  }
  if (act === 'choosefrom'){
    openAttackModal(el.getAttribute('data-from'), el.getAttribute('data-to'));
    return;
  }

  if (act === 'confirmattack'){
    const fromId = el.getAttribute('data-from');
    const toId = document.getElementById('atkTarget').value;
    const genId = document.getElementById('atkGen').value;
    const troops = Number(document.getElementById('atkTroops').value);
    const mixRoot = document.getElementById('mixEditor');
    const mix = normMix(readMixInputs(mixRoot));
    const from = state.cities[fromId];
    if (!from || !state.cities[toId] || !state.generals[genId]) return;
    const send = clamp(troops, 1000, Math.max(1000, from.troops - 500));
    document.getElementById('modalRoot').innerHTML = '';
    createMarch(fromId, toId, genId, send, mix);
    toast('大軍開拔，' + MARCH_TURNS + ' 季後抵達 ' + CITY_BY_ID[toId].name);
    checkGameOver();
    refresh();
    return;
  }

  if (act === 'closemask'){
    document.getElementById('modalRoot').innerHTML = '';
    return;
  }

  if (act === 'setgov'){
    const v = document.getElementById('govSel').value;
    state.cities[sel].governor = v;
    addLog(CITY_BY_ID[sel].name + ' 任命 ' + state.generals[v].name + ' 為太守', '');
    refresh();
    return;
  }

  if (act === 'gift'){
    const f = el.getAttribute('data-f');
    const t = state.treasury[state.player];
    if (t.gold < 200) return toast('金不足');
    t.gold -= 200;
    state.rel[state.player][f] = clamp(state.rel[state.player][f] + 12, 0, 100);
    state.rel[f][state.player] = clamp(state.rel[f][state.player] + 10, 0, 100);
    addLog('遣使贈金於 ' + FACTIONS[f].name + '，關係改善', 'good');
    refresh();
    return;
  }

  if (act === 'ally'){
    const f = el.getAttribute('data-f');
    if (allyCount() >= diffCfg().allyCap) return toast('同盟已達上限（難度「'+diffCfg().label+'」最多 '+diffCfg().allyCap+' 位）');
    state.rel[state.player][f] = 100;
    state.rel[f][state.player] = 100;
    addLog('與 ' + FACTIONS[f].name + ' 結為同盟', 'good');
    AudioSys.win();
    refresh();
    return;
  }

  if (act === 'tribegift'){
    const k = el.getAttribute('data-t');
    const t = TRIBES[k];
    if (!t || !state.tribes[k]) return;
    const tre = state.treasury[state.player];
    if (tre.gold < t.giftCost) return toast('金不足（需 ' + t.giftCost + '）');
    tre.gold -= t.giftCost;
    const tb = state.tribes[k];
    const gain = rint(9, 16);
    tb.rel = clamp(tb.rel + gain, 0, 100);
    if (tb.rel >= t.allyReq) addLog(t.name + ' 亦樂於通好，可議結盟矣', 'good');
    else addLog('遣使贈金於 ' + t.name + '，關係升至 ' + tb.rel, '');
    AudioSys.coin();
    refresh();
    return;
  }

  if (act === 'tribeally'){
    const k = el.getAttribute('data-t');
    const t = TRIBES[k];
    if (!t || !state.tribes[k]) return;
    const tb = state.tribes[k];
    if (tb.rel < t.allyReq) return toast('關係未達 ' + t.allyReq);
    if (allyCount() + tribeAllyCount() >= diffCfg().allyCap) return toast('同盟總數已達上限');
    tb.ally = true;
    tb.rel = 100;
    addLog('與 ' + t.name + ' 歃盟：' + t.desc, 'good');
    AudioSys.win();
    refresh();
    return;
  }

  if (act === 'help'){ showHelp(); return; }
  if (act === 'savegame'){ saveGame(); return; }
  if (act === 'loadgame' || act === 'loadstart'){ loadGame(); return; }
  if (act === 'newgame'){ confirmNewGame(); return; }
  if (act === 'confirmnewgame'){
    document.getElementById('modalRoot').innerHTML = '';
    backToStart();
    AudioSys.click();
    return;
  }
  if (act === 'restart'){ location.reload(); return; }
});

       '金、糧儲存上限各為 '+RES_CAP+'，超過即溢出——該用就用。</div>';
  h += '<div class="grp-title">難度與同盟</div>';
  h += '<div style="line-height:2;color:var(--ink-2);font-size:12.5px">'+
       '開局可選簡單／普通／困難，影響 AI 強度、我方收入與同盟上限。<br>'+
       '外交：關係達 75 可與諸侯結盟；另有匈奴、羌、烏桓、山越、南蠻五支外族，'+
       '贈金通好、達標可結盟，每季產生貢品或援軍（烏桓協同攻擊、山越援防）。'+
       '同盟總數受難度上限約束。</div>';
  h += '<div class="grp-title">勝負</div>';
  h += '<div style="line-height:2;color:var(--ink-2);font-size:12.5px">'+
       '佔領全部城池即統一天下；城池盡失則霸業終結。</div>';
  h += '</div><div class="modal-foot"><button data-act="closemask">知　悉</button></div></div></div>';
  document.getElementById('modalRoot').innerHTML = h;
}

/* ==================== 存檔（localStorage） ==================== */
const SAVE_KEY = 'sgz_save_v1';
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
}
function saveInfo(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.state || !d.state.cities) return null;
    return {turn: d.state.turn, ts: d.ts,
            faction: FACTIONS[d.state.player] ? FACTIONS[d.state.player].name : '—'};
  } catch(e){ return null; }
}
function saveGame(){
  if (!state) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, ts:Date.now(), state:state}));
    toast('對局已儲存（第 ' + state.turn + ' 季）');
    AudioSys.coin();
    renderStart();                       // 更新開始畫面的載入按鈕
  } catch(e){ toast('儲存失敗：瀏覽器不允許寫入'); }
}
/* 載入後修正常衍生態勢並進入遊戲 */
function afterLoad(){
  marchSeq = 1;
  (state.marches || []).forEach(m=>{ if (m.id >= marchSeq) marchSeq = m.id + 1; });
  (state.marches || []).forEach(m=>{
    if (m.disp == null) m.disp = clamp((MARCH_TURNS - m.eta) / MARCH_TURNS, 0, 1);
  });
  sel = factionCities(state.player)[0] || null;
  tab = 'city';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('modalRoot').innerHTML = '';
  refresh();
}
function loadGame(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){}
  if (!d || !d.state || !d.state.cities){ toast('尚無存檔或存檔損毀'); return; }
  state = d.state;
  afterLoad();
  toast('已載入存檔（第 ' + state.turn + ' 季）');
  AudioSys.coin();
}
/* 回到開局畫面（重開） */
function backToStart(){
  state = null;
  document.getElementById('game').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('modalRoot').innerHTML = '';
  document.getElementById('customWrap').classList.remove('on');
  document.getElementById('factionList').style.display = '';
  const oc = document.querySelector('[data-act="opencustom"]');
  if (oc) oc.style.display = '';
  renderStart();
}
function confirmNewGame(){
  let h = '<div class="mask" data-dismiss="1"><div class="modal" style="max-width:380px">';
  h += '<div class="modal-head"><span>新開遊戲</span><button class="x" data-act="closemask">×</button></div>';
  h += '<div class="modal-body" style="padding:22px;line-height:1.9;font-size:13px;color:var(--ink-2)">' +
       '將回到開局畫面選擇勢力；目前的對局若未儲存就會消失。</div>';
  h += '<div class="modal-foot" style="justify-content:center">' +
       '<button data-act="closemask">取消</button>' +
       '<button data-act="confirmnewgame" style="background:var(--accent);border-color:var(--accent)">放棄並重開</button>' +
       '</div></div></div>';
  document.getElementById('modalRoot').innerHTML = h;
}

/* ==================== 啟動 ==================== */
function renderStart(){
  const list = document.getElementById('factionList');
  let h = '';
  ['cao','sun','yuan','liu','ma'].forEach(f=>{
    const fac = FACTIONS[f];
    const cities = CITY_DEFS.filter(d=> d.f === f).length;
    const troops = CITY_DEFS.filter(d=> d.f === f).reduce((s,d)=> s + d.troops, 0);
    const gens = GENERAL_DEFS.filter(g=> g.f === f).length;
    h += '<div class="fcard" data-act="start" data-f="'+f+'">';
    h += '<div class="fbar" style="background:'+fac.color+'"></div>';
    h += '<div class="fname" style="color:'+fac.color+'">'+fac.name+'</div>';
    h += '<div class="fseat">據 '+fac.seat+'</div>';
    h += '<div class="finfo">城池 '+cities+'　武將 '+gens+'<br>兵力 '+fmtT(troops)+'</div>';
    h += '<div class="fdiff" style="color:'+fac.diffColor+'">'+fac.diff+'</div>';
    h += '</div>';
  });
  list.innerHTML = h;

  // 自建勢力可用城市
  const cs = document.getElementById('cfCity');
  let ch = '';
  CITY_DEFS.forEach(d=>{
    ch += '<option value="'+d.id+'" '+(d.f==='cao'&&d.name==='洛陽'?'selected':'')+'>'+
          d.name+'（'+d.region+'　'+FACTIONS[d.f].name+'）</option>';
  });
  cs.innerHTML = ch;

  // 存檔按鈕：有存檔才顯示，並帶上摘要
  const lb = document.getElementById('loadSaveBtn');
  if (lb){
    const info = saveInfo();
    if (info){
      lb.style.display = '';
      lb.textContent = '載入存檔（第 ' + info.turn + ' 季 · ' + info.faction + '）';
    } else {
      lb.style.display = 'none';
      lb.textContent = '載入存檔';
    }
  }
}

function startGame(f, custom){
  state = buildState(f, custom, difficulty);
  sel = null;
  if (custom){
    sel = custom.city;
  } else {
    CITY_DEFS.forEach(d=>{ if (d.f === f && d.name === FACTIONS[f].seat) sel = d.id; });
    if (!sel) sel = factionCities(f)[0];
  }
  tab = 'city';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  addLog('建安年間，' + FACTIONS[f].name + ' 起兵，志在天下。', 'turn');
  AudioSys.startBGM();
  refresh();
}

renderStart();

// 音樂開關
document.getElementById('audBtn').addEventListener('click', function(){
  AudioSys.toggle();
});

// 供除錯與數值檢視用（不影響遊戲）
window.SGZ = { get state(){ return state; }, CITY_BY_ID: CITY_BY_ID, FACTIONS: FACTIONS,
  CITY_DEFS: CITY_DEFS,
  TROOPS: TROOPS, TKEYS: TKEYS, normMix: normMix, counterBonus: counterBonus,
  counterMix: counterMix, resolveBattle: resolveBattle, initMix: initMix,
  MARCH_TURNS: MARCH_TURNS, createMarch: createMarch, stepMarches: stepMarches,
  renderMarchbar: renderMarchbar, resolveMarch: resolveMarch,
  Map3D: Map3D, RIVERS: RIVERS, RANGES: RANGES,
  saveGame: saveGame, loadGame: loadGame, hasSave: hasSave,
  saveInfo: saveInfo, backToStart: backToStart, SAVE_KEY: SAVE_KEY };
})();
</script>
