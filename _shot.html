<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三國志 · 霸業</title>
<style>
:root{
  --paper:#f4ecdc; --paper-2:#ebe0cb; --paper-3:#e2d5ba;
  --ink:#2a241d; --ink-2:#5d5344; --ink-3:#8b7f6b;
  --line:#cbb994; --line-2:#ded1b6;
  --accent:#9e2f2a; --accent-2:#c14b3f; --gold:#a8802a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Songti TC","Songti SC","STSong","SimSun","Noto Serif TC",serif;
  background:var(--paper); color:var(--ink); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 20% 10%, #fffaf0 0%, transparent 45%),
                   radial-gradient(circle at 85% 80%, #f0e5cf 0%, transparent 50%);
}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);padding:6px 10px;border-radius:3px;font-size:13px;transition:.15s}
button:hover:not(:disabled){background:var(--paper-3);border-color:var(--ink-3)}
button:disabled{opacity:.4;cursor:not-allowed}
select,input{font-family:inherit;font-size:13px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:5px 7px}
.hidden{display:none !important}

/* ===== 開始畫面 ===== */
#startScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:50;padding:24px;overflow:auto}
.title-wrap{text-align:center;margin-bottom:28px}
h1.main-title{font-size:64px;letter-spacing:18px;font-weight:400;color:var(--ink);
  text-indent:18px;line-height:1.1}
.main-sub{font-size:14px;letter-spacing:8px;color:var(--ink-3);margin-top:10px;text-indent:8px}
.rule-line{width:180px;height:1px;background:var(--line);margin:16px auto}
.faction-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;max-width:1000px;width:100%}
.fcard{background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:16px;
  text-align:center;transition:.18s;cursor:pointer;position:relative;overflow:hidden}
.fcard:hover{transform:translateY(-3px);border-color:var(--ink-3);box-shadow:0 6px 18px rgba(80,60,30,.14)}
.fcard .fname{font-size:26px;letter-spacing:4px;margin-bottom:4px}
.fcard .fseat{font-size:12px;color:var(--ink-3);letter-spacing:2px}
.fcard .finfo{font-size:12px;color:var(--ink-2);margin-top:10px;line-height:1.8}
.fcard .fdiff{display:inline-block;margin-top:10px;font-size:11px;padding:2px 10px;
  border-radius:10px;border:1px solid currentColor}
.fcard .fbar{position:absolute;left:0;top:0;bottom:0;width:4px}
.tips{margin-top:26px;font-size:12px;color:var(--ink-3);letter-spacing:1px;text-align:center;line-height:2}

/* ===== 主介面 ===== */
#game{display:flex;flex-direction:column;height:100vh}
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;
  border-bottom:1px solid var(--line);background:rgba(235,224,203,.85);backdrop-filter:blur(4px)}
.brand{font-size:19px;letter-spacing:5px;color:var(--ink)}
.brand small{font-size:11px;letter-spacing:2px;color:var(--ink-3);margin-left:6px}
.chips{display:flex;gap:6px;margin-left:8px}
.chip{font-size:12px;padding:3px 10px;border:1px solid var(--line-2);border-radius:3px;
  background:var(--paper);color:var(--ink-2);letter-spacing:1px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600;margin-left:3px}
.spacer{flex:1}
#endTurn{background:var(--accent);color:#fff8ee;border-color:var(--accent);
  padding:8px 22px;font-size:14px;letter-spacing:3px}
#endTurn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.icon-btn{padding:6px 12px;font-size:12px;letter-spacing:1px}

.main{flex:1;display:flex;min-height:0}
.map-wrap{flex:1;position:relative;min-width:0;background:
  radial-gradient(circle at 50% 45%, #fbf4e4 0%, #efe4cd 70%, #e7d9bd 100%)}
.map-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(#c9b995 0.6px, transparent 0.6px);
  background-size:22px 22px}
svg#map{width:100%;height:100%;display:block;position:relative}
.road{stroke:#c3b092;stroke-width:1.4;stroke-dasharray:4 4;opacity:.7}
.city{cursor:pointer}
.city circle.node{stroke:#3a3128;stroke-width:1.6;transition:.15s}
.city:hover circle.node{stroke-width:3}
.city.sel circle.node{stroke:#1a1510;stroke-width:3.4;filter:drop-shadow(0 0 6px rgba(158,47,42,.55))}
.city text.cname{fill:#fff8ee;font-size:13px;text-anchor:middle;pointer-events:none;
  letter-spacing:1px;font-weight:600}
.city text.ctroops{fill:#6b604f;font-size:10.5px;text-anchor:middle;pointer-events:none;letter-spacing:.5px}
.capital-ring{fill:none;stroke:#a8802a;stroke-width:1.2;stroke-dasharray:3 3;opacity:.9}

.side{width:372px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;
  background:rgba(244,236,220,.75);min-height:0}
.tabs{display:flex;flex:none;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:10px 0;
  font-size:13px;letter-spacing:3px;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:rgba(255,250,240,.6)}
.panel{flex:1;overflow-y:auto;padding:14px}
.panel::-webkit-scrollbar{width:7px}
.panel::-webkit-scrollbar-thumb{background:#d2c2a2;border-radius:4px}

.card{background:rgba(255,250,240,.72);border:1px solid var(--line-2);border-radius:4px;
  padding:12px 13px;margin-bottom:11px}
.card-title{font-size:12px;letter-spacing:3px;color:var(--ink-3);margin-bottom:9px;
  display:flex;align-items:center;gap:7px}
.card-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
.city-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.city-name-lg{font-size:23px;letter-spacing:4px}
.region-tag{font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);
  padding:1px 7px;border-radius:2px;margin-left:7px;letter-spacing:1px;vertical-align:middle}
.owner-tag{font-size:13px;letter-spacing:2px;font-weight:600}

.stat-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin:5px 0}
.stat-row .lbl{width:34px;flex:none;letter-spacing:1px}
.bar{flex:1;height:7px;background:#e0d3b8;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b99457,#a8802a);
  border-radius:4px;transition:width .3s}
.bar.b2 i{background:linear-gradient(90deg,#6f9ab5,#2f6fb3)}
.bar.b3 i{background:linear-gradient(90deg,#8a9c7c,#4c7a4a)}
.bar.b4 i{background:linear-gradient(90deg,#c98f6f,#9e2f2a)}
.stat-row .val{width:26px;text-align:right;color:var(--ink);font-weight:600}

.meta-line{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);
  margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)}
.meta-line b{color:var(--ink)}

.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act-btn{display:flex;flex-direction:column;align-items:flex-start;padding:7px 9px;text-align:left;
  line-height:1.4;background:rgba(255,250,240,.6)}
.act-btn .an{font-size:13px;letter-spacing:1px}
.act-btn .ac{font-size:10.5px;color:var(--ink-3)}
.act-btn:hover:not(:disabled) .ac{color:var(--ink-2)}
.btn-wide{width:100%;padding:9px;font-size:14px;letter-spacing:4px;
  background:rgba(158,47,42,.08);border-color:#c9a9a0;color:var(--accent)}
.btn-wide:hover:not(:disabled){background:rgba(158,47,42,.16);border-color:var(--accent)}

.gen-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line-2);
  font-size:12px}
.gen-row:last-child{border-bottom:none}
.gen-name{font-size:14px;letter-spacing:2px;width:52px;flex:none}
.gen-stats{display:flex;gap:7px;color:var(--ink-2);font-size:11px}
.gen-stats span b{color:var(--ink)}
.gen-loc{margin-left:auto;font-size:11px;color:var(--ink-3)}
.grp-title{font-size:12px;letter-spacing:2px;color:var(--accent);margin:12px 0 4px;
  padding-bottom:4px;border-bottom:1px solid var(--line-2)}
.grp-title:first-child{margin-top:0}

.dip-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.dip-row .dn{width:56px;flex:none;letter-spacing:2px}
.dip-row .dbar{flex:1;height:6px;background:#e0d3b8;border-radius:3px;overflow:hidden}
.dip-row .dbar i{display:block;height:100%;background:linear-gradient(90deg,#c99a7a,#9e2f2a)}
.dip-row .dstat{width:44px;text-align:right;font-size:11px;color:var(--ink-3)}

.logbar{height:104px;flex:none;border-top:1px solid var(--line);background:rgba(235,224,203,.6);
  overflow-y:auto;padding:8px 16px;font-size:12px;line-height:1.9;color:var(--ink-2)}
.logbar::-webkit-scrollbar{width:7px}
.logbar::-webkit-scrollbar-thumb{background:#d2c2a2;border-radius:4px}
.log-line span.t{color:var(--ink-3);margin-right:8px;font-size:11px}
.log-line.war{color:var(--accent)}
.log-line.good{color:#2f6b47}
.log-line.bad{color:#8a4a2a}
.log-line.turn{color:var(--gold);border-top:1px dashed var(--line-2);margin-top:5px;padding-top:4px;
  letter-spacing:2px;font-size:11px}

/* ===== Modal ===== */
.mask{position:fixed;inset:0;background:rgba(42,36,29,.42);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:5px;
  box-shadow:0 18px 50px rgba(40,30,15,.32);width:100%;max-width:480px;max-height:88vh;
  display:flex;flex-direction:column}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);font-size:17px;letter-spacing:4px;
  display:flex;justify-content:space-between;align-items:center}
.modal-head .x{border:none;background:transparent;font-size:20px;color:var(--ink-3);padding:0 4px}
.modal-body{padding:16px 18px;overflow-y:auto;font-size:13px;line-height:1.9}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.field{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.field label{width:52px;flex:none;color:var(--ink-2);font-size:12px;letter-spacing:2px}
.field select,.field input[type=range]{flex:1}
.field .rngval{width:58px;text-align:right;font-weight:600}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.9;background:rgba(226,213,186,.4);
  padding:8px 11px;border-radius:3px;border-left:2px solid var(--line)}
.battle-line{font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--line-2);color:var(--ink-2)}
.battle-line:last-child{border-bottom:none}
.battle-line.hl{color:var(--accent);font-weight:600}
.result-banner{text-align:center;font-size:22px;letter-spacing:8px;margin:6px 0 14px;text-indent:8px}
.result-banner.win{color:#2f6b47}
.result-banner.lose{color:var(--accent)}
.diff-badge{display:inline-block;font-size:11px;padding:1px 9px;border-radius:9px;
  border:1px solid currentColor;letter-spacing:1px}
</style>
</head>
<body>

<!-- 開始畫面 -->
<div id="startScreen">
  <div class="title-wrap">
    <h1 class="main-title">三國志</h1>
    <div class="main-sub">霸 業</div>
    <div class="rule-line"></div>
    <div style="font-size:12.5px;color:var(--ink-2);letter-spacing:2px;line-height:2">
      東漢建安年間 · 群雄割據 · 擇一而主，併吞天下
    </div>
  </div>
  <div class="faction-list" id="factionList"></div>
  <div class="tips">
    每回合＝一季　·　城池可下 1 道內政令、出 1 次兵　·　佔領全部城池即得天下
  </div>
</div>

<!-- 主介面 -->
<div id="game" class="hidden">
  <div class="topbar">
    <div class="brand">三國志<small>霸業</small></div>
    <div class="chips">
      <div class="chip">回合<b id="cTurn">1</b></div>
      <div class="chip">金<b id="cGold">0</b></div>
      <div class="chip">糧<b id="cFood">0</b></div>
      <div class="chip">城<b id="cCities">0</b></div>
      <div class="chip">兵<b id="cTroops">0</b></div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" data-act="help">兵法說明</button>
    <button id="endTurn" data-act="endturn">結束回合</button>
  </div>

  <div class="main">
    <div class="map-wrap">
      <svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <aside class="side">
      <div class="tabs">
        <button data-act="tab" data-tab="city" class="on">城池</button>
        <button data-act="tab" data-tab="general">武將</button>
        <button data-act="tab" data-tab="diplo">外交</button>
      </div>
      <div class="panel" id="panel"></div>
    </aside>
  </div>

  <div class="logbar" id="logbar"></div>
</div>

<div id="modalRoot"></div>

/* ==================== 工具 ==================== */
const rnd  = (a,b)=> a + Math.random()*(b-a);
const rint = (a,b)=> Math.floor(a + Math.random()*(b-a+1));
const clamp= (v,a,b)=> Math.max(a, Math.min(b, v));
const fmtT = n => n >= 10000 ? (n/10000).toFixed(1)+'萬' : String(Math.round(n));
const CITY_BY_ID = {};
CITY_DEFS.forEach(c=> CITY_BY_ID[c.id] = c);

let state = null;
let sel = null;
let tab = 'city';

/* ==================== 建立對局 ==================== */
function buildState(playerFaction){
  const cities = {};
  CITY_DEFS.forEach(d=>{
    cities[d.id] = {
      id:d.id, owner:d.f, troops:d.troops,
      agri:d.agri, comm:d.comm, def:d.def, loy:d.loy,
      acted:false, moved:false, governor:null
    };
  });

  const generals = {};
  GENERAL_DEFS.forEach(g=>{ generals[g.id] = Object.assign({}, g, {city:null}); });

  const byFaction = {};
  GENERAL_DEFS.forEach(g=>{ (byFaction[g.f] = byFaction[g.f] || []).push(g.id); });

  Object.keys(byFaction).forEach(f=>{
    const cap = FACTIONS[f].seat;
    const list = CITY_DEFS.filter(d=> d.f === f).map(d=> d.id);
    list.sort((a,b)=>{
      const ca = CITY_BY_ID[a].name === cap ? -1 : 0;
      const cb = CITY_BY_ID[b].name === cap ? -1 : 0;
      return ca - cb;
    });
    byFaction[f].forEach((gid, i)=>{
      const cid = list[i % list.length];
      generals[gid].city = cid;
      if (!cities[cid].governor) cities[cid].governor = gid;
    });
  });

  const treasury = {};
  Object.keys(FACTIONS).forEach(f=>{
    if (f === 'none') return;
    treasury[f] = {gold: 600, food: 1200};
  });

  const rel = {};
  Object.keys(FACTIONS).forEach(a=>{
    if (a === 'none') return;
    rel[a] = {};
    Object.keys(FACTIONS).forEach(b=>{
      if (b === 'none') return;
      rel[a][b] = a === b ? 100 : 50;
    });
  });

  return {
    turn: 1, player: playerFaction, cities, generals, treasury, rel,
    log: [], over: false
  };
}

/* ==================== 查詢 ==================== */
function factionCities(f){
  return CITY_DEFS.filter(d=> state.cities[d.id].owner === f).map(d=> d.id);
}
function factionTroops(f){
  return factionCities(f).reduce((s,id)=> s + state.cities[id].troops, 0);
}
function isDead(f){
  return factionCities(f).length === 0;
}
function generalsIn(cityId){
  return Object.values(state.generals).filter(g=> g.city === cityId);
}
function bestGeneralIn(cityId){
  const list = generalsIn(cityId);
  if (!list.length) return null;
  return list.slice().sort((a,b)=> b.lead - a.lead)[0];
}
function ownerName(cityId){
  return FACTIONS[state.cities[cityId].owner].name;
}
function addLog(text, cls){
  state.log.push({t: state.turn, text, cls: cls || ''});
  if (state.log.length > 400) state.log.shift();
}

/* ==================== 渲染：地圖 ==================== */
function renderMap(){
  const svg = document.getElementById('map');
  let s = '';

  const seen = {};
  CITY_DEFS.forEach(c=>{
    c.adj.forEach(a=>{
      const key = [c.id,a].sort().join('|');
      if (seen[key]) return;
      seen[key] = 1;
      const t = CITY_BY_ID[a];
      s += '<line class="road" x1="'+c.x+'" y1="'+c.y+'" x2="'+t.x+'" y2="'+t.y+'"/>';
    });
  });

  CITY_DEFS.forEach(c=>{
    const st = state.cities[c.id];
    const fac = FACTIONS[st.owner];
    const isSel = sel === c.id;
    const cap = st.owner !== 'none' && FACTIONS[st.owner].seat === c.name;
    s += '<g class="city'+(isSel?' sel':'')+'" data-act="pick" data-id="'+c.id+'">';
    if (cap) s += '<circle class="capital-ring" cx="'+c.x+'" cy="'+c.y+'" r="30"/>';
    s += '<circle class="node" cx="'+c.x+'" cy="'+c.y+'" r="23" fill="'+fac.color+'"/>';
    s += '<text class="cname" x="'+c.x+'" y="'+(c.y+4)+'">'+c.name+'</text>';
    s += '<text class="ctroops" x="'+c.x+'" y="'+(c.y+40)+'">'+fmtT(st.troops)+'</text>';
    s += '</g>';
  });

  svg.innerHTML = s;
}

    '<div class="bar '+(cls||'')+'"><i style="width:'+clamp(val,0,100)+'%"></i></div>'+
    '<span class="val">'+Math.round(val)+'</span></div>';
}

/* ==================== 內政 ==================== */
function doAction(kind){
  const c = state.cities[sel];
  const t = state.treasury[state.player];
  if (c.acted) return;
  const gov = c.governor ? state.generals[c.governor] : null;
  const polBonus = gov ? (gov.pol - 60) / 8 : -2;
  const name = CITY_BY_ID[sel].name;

  if (kind === 'develop'){
    if (t.gold < 80) return toast('金不足');
    t.gold -= 80;
    const g = rint(4,7) + Math.max(0, Math.round(polBonus));
    c.agri = clamp(c.agri + g, 0, 100);
    addLog(name + ' 開墾農田，農業 +' + g, 'good');
  } else if (kind === 'commerce'){
    if (t.gold < 80) return toast('金不足');
    t.gold -= 80;
    const g = rint(4,7) + Math.max(0, Math.round(polBonus));
    c.comm = clamp(c.comm + g, 0, 100);
    addLog(name + ' 招徠商賈，商業 +' + g, 'good');
  } else if (kind === 'fortify'){
    if (t.gold < 100) return toast('金不足');
    t.gold -= 100;
    const g = rint(3,6) + Math.max(0, Math.round(polBonus / 2));
    c.def = clamp(c.def + g, 0, 100);
    addLog(name + ' 加固城防，城防 +' + g, 'good');
  } else if (kind === 'recruit'){
    if (t.gold < 120) return toast('金不足');
    if (c.loy < 35) return toast('民忠過低，無法徵兵');
    t.gold -= 120;
    const add = Math.round(3000 * (0.6 + c.loy/200) * (gov ? 1 + (gov.lead-60)/300 : 1));
    c.troops += add;
    c.loy = clamp(c.loy - 4, 0, 100);
    addLog(name + ' 徵兵 ' + fmtT(add) + '，民忠 -4', '');
  } else if (kind === 'appease'){
    if (t.gold < 60) return toast('金不足');
    t.gold -= 60;
    const g = rint(5,9) + Math.max(0, Math.round(polBonus / 2));
    c.loy = clamp(c.loy + g, 0, 100);
    addLog(name + ' 賑濟百姓，民忠 +' + g, 'good');
  } else if (kind === 'drill'){
    if (t.gold < 50) return toast('金不足');
    t.gold -= 50;
    addLog(name + ' 操練兵馬，士氣提振', '');
  }

  c.acted = true;
  refresh();
}

/* ==================== 戰鬥 ==================== */
function resolveBattle(fromId, toId, genId, sendTroops){
  const from = state.cities[fromId];
  const to = state.cities[toId];
  const ag = state.generals[genId];
  const dgId = to.governor || (bestGeneralIn(toId) ? bestGeneralIn(toId).id : null);
  const dg = dgId ? state.generals[dgId] : null;

  const dStart = to.troops;
  let aT = sendTroops, dT = to.troops;
  const lines = [];
  let aMorale = 1, dMorale = 1;

  // 單挑
  if (dg && Math.random() < 0.28){
    const as = ag.might + rint(0, 22);
    const ds = dg.might + rint(0, 22);
    if (as > ds){
      aMorale = 1.12; dMorale = 0.9;
      lines.push({t:'單挑：' + ag.name + ' 力克 ' + dg.name + '，我軍士氣大振。', hl:true});
    } else {
      aMorale = 0.9; dMorale = 1.12;
      lines.push({t:'單挑：' + ag.name + ' 不敵 ' + dg.name + '，軍心動搖。', hl:true});
    }
  }

  // 計略
  if (ag.int > (dg ? dg.int : 50) + 8 && Math.random() < 0.55){
    const dmg = Math.round(dT * rnd(0.05, 0.10));
    dT -= dmg;
    lines.push({t:'計略：' + ag.name + ' 智謀過人，火計焚營，敵軍折損 ' + dmg + '。', hl:true});
  }

  const defBonus = 1 + to.def / 260;

  for (let r = 1; r <= 4 && aT > 0 && dT > 0; r++){
    const aPow = aT * (0.55 + ag.lead / 220) * aMorale;
    const dPow = dT * (0.55 + (dg ? dg.lead : 55) / 220) * dMorale;
    const aLoss = Math.round(dPow * 0.15 * rnd(0.9, 1.1));
    const dLoss = Math.round(aPow * 0.18 / defBonus * rnd(0.9, 1.1));
    aT = Math.max(0, aT - aLoss);
    dT = Math.max(0, dT - dLoss);
    lines.push({t:'第 ' + r + ' 陣：我軍折 ' + aLoss + '，敵軍折 ' + dLoss +
                  '（我 ' + Math.round(aT) + ' / 敵 ' + Math.round(dT) + '）'});
  }

  let win;
  if (dT <= 0 || dT < dStart * 0.15) win = true;
  else if (aT <= 0) win = false;
  else win = false;

  return {win, lines, aLeft: Math.round(aT), dLeft: Math.round(dT),
          fromId, toId, genId, dgId, sent: sendTroops};
}

function applyBattle(res){
  const from = state.cities[res.fromId];
  const to = state.cities[res.toId];
  const atkFac = from.owner;

  from.troops = Math.max(0, from.troops - res.sent);

  if (res.win){
    const oldOwner = to.owner;
    to.owner = atkFac;
    to.troops = Math.max(1000, Math.round(res.aLeft * 0.85));
    to.def = Math.round(to.def * 0.4);
    to.loy = clamp(to.loy - 25, 10, 100);
    to.acted = true; to.moved = false;
    to.governor = res.genId;
    if (state.generals[res.genId]) state.generals[res.genId].city = res.toId;

    // 守將撤回或成擒
    const defGens = generalsIn(res.toId);
    defGens.forEach(g=>{
      if (g.id === res.genId) return;
      const refuge = factionCities(oldOwner).filter(id=> id !== res.toId);
      if (refuge.length){
        g.city = refuge[0];
      } else {
        g.city = res.toId;
        g.f = atkFac;
        g.loy = 40;
      }
    });

    addLog(FACTIONS[atkFac].name + ' 攻克 ' + CITY_BY_ID[res.toId].name +
           '（守軍 ' + fmtT(res.dLeft) + ' 潰）', 'war');
    if (isDead(oldOwner)) addLog(FACTIONS[oldOwner].name + ' 勢力滅亡！', 'turn');
  } else {
    to.troops = Math.max(0, res.dLeft);
    from.troops += res.aLeft;
    addLog(FACTIONS[atkFac].name + ' 攻 ' + CITY_BY_ID[res.toId].name + ' 未克，退兵', 'bad');
  }
}

/* ==================== 出征 UI ==================== */
function openAttackModal(fromId, presetTarget){
  const from = state.cities[fromId];
  const fromDef = CITY_BY_ID[fromId];
  const targets = fromDef.adj.filter(id=> state.cities[id].owner !== state.player);
  if (!targets.length) return;
  const gens = generalsIn(fromId);
  if (!gens.length) return toast('此城無武將可領兵');

  let h = '<div class="mask" data-act="closemask"><div class="modal" onclick="event.stopPropagation()">';
  h += '<div class="modal-head"><span>出　征</span><button class="x" data-act="closemask">×</button></div>';
  h += '<div class="modal-body">';
  h += '<div class="field"><label>自城</label><div style="flex:1;font-size:15px;letter-spacing:2px">'+
       fromDef.name+'（駐軍 '+fmtT(from.troops)+'）</div></div>';
  h += '<div class="field"><label>目標</label><select id="atkTarget">';
  targets.forEach(id=>{
    const c = state.cities[id];
    h += '<option value="'+id+'" '+(id===defTarget?'selected':'')+'>'+
         CITY_BY_ID[id].name+'（'+FACTIONS[c.owner].name+'　守軍 '+fmtT(c.troops)+
         '　城防 '+Math.round(c.def)+'）</option>';
  });
  h += '</select></div>';
  h += '<div class="field"><label>主將</label><select id="atkGen">';
  gens.forEach(g=>{
    h += '<option value="'+g.id+'" '+(g.id===from.governor?'selected':'')+'>'+g.name+
         '（統'+g.lead+' 武'+g.might+' 智'+g.int+'）</option>';
  });
  h += '</select></div>';
  h += '<div class="field"><label>兵力</label><input type="range" id="atkTroops" min="2000" max="'+
       Math.max(2000, maxTroops)+'" step="500" value="'+Math.max(2000, Math.round(maxTroops*0.8))+'">'+
       '<span class="rngval" id="atkTroopsVal"></span></div>';
  h += '<div class="hint" id="atkHint"></div>';
  h += '</div>';
  h += '<div class="modal-foot"><button data-act="closemask">取　消</button>'+
       '<button data-act="confirmattack" data-from="'+fromId+'" '+
       (maxTroops < 2000 ? 'disabled' : '')+
       ' style="background:var(--accent);color:#fff8ee;border-color:var(--accent)">出　擊</button></div>';
  h += '</div></div>';

  document.getElementById('modalRoot').innerHTML = h;

  const range = document.getElementById('atkTroops');
  const update = ()=>{
    const tgt = document.getElementById('atkTarget').value;
    const tc = state.cities[tgt];
    if (!tc) return;
    const tv = Number(range.value) || 0;
    document.getElementById('atkTroopsVal').textContent = fmtT(tv);
    const ratio = tv / Math.max(1, tc.troops);
    const def = tc.def;
    let verdict;
    if (ratio >= 1.8) verdict = '兵力優勢明顯，勝算甚高。';
    else if (ratio >= 1.3) verdict = '兵力略優，勝負取決於將才。';
    else if (ratio >= 0.9) verdict = '勢均力敵，恐成苦戰。';
    else verdict = '兵力不足，強攻凶多吉少。';
    document.getElementById('atkHint').textContent =
      '敵城防 ' + Math.round(def) + '　我軍 ' + fmtT(tv) + ' vs 守軍 ' + fmtT(tc.troops) +
      '（' + ratio.toFixed(2) + ' 倍）　—　' + verdict;
  };
  range.addEventListener('input', update);
  document.getElementById('atkTarget').addEventListener('change', update);
  update();
}

/* ==================== 回合流程 ==================== */
function endTurn(){
  if (state.over) return;

  // 1. 收入結算
  Object.keys(FACTIONS).forEach(f=>{
    if (f === 'none' || isDead(f)) return;
    const inc = incomeFor(f);
    const t = state.treasury[f];
    t.gold = Math.max(0, t.gold + inc.gold);
    t.food = t.food + inc.food;
    applyStarvation(f);
  });
  const inc = incomeFor(state.player);
  addLog('歲入：金 +' + inc.gold + '　糧 ' + (inc.food>=0?'+':'') + inc.food, '');

  // 2. 隨機事件
  randomEvent();

  // 3. AI 行動
  aiTurn();

  // 4. 新回合
  state.turn++;
  CITY_DEFS.forEach(d=>{
    const c = state.cities[d.id];
    c.acted = false; c.moved = false;
  });
  addLog('', 'turn');

  checkGameOver();
  refresh();
}

function incomeFor(f){
  let gold = 0, food = 0, troops = 0;
  factionCities(f).forEach(id=>{
    const c = state.cities[id];
    const loyMul = 0.6 + c.loy / 250;
    gold += c.comm * 2.0 * loyMul;
    food += c.agri * 1.5 * loyMul;
    troops += c.troops;
  });
  food -= troops / 200;
  return {gold: Math.round(gold), food: Math.round(food)};
}

// 缺糧：軍隊逃散
function applyStarvation(f){
  const t = state.treasury[f];
  if (t.food >= 0) return;
  const list = factionCities(f);
  let lost = 0;
  list.forEach(id=>{
    const c = state.cities[id];
    const d = Math.round(c.troops * 0.06);
    c.troops = Math.max(0, c.troops - d);
    lost += d;
  });
  t.food = 0;
  if (f === state.player) addLog('糧盡！軍中逃散 ' + fmtT(lost) + ' 人', 'bad');
}

function randomEvent(){
  if (Math.random() > 0.38) return;
  const myCities = factionCities(state.player);
  if (!myCities.length) return;
  const cid = myCities[rint(0, myCities.length - 1)];
  const c = state.cities[cid];
  const name = CITY_BY_ID[cid].name;
  const roll = rint(1, 6);

  if (roll === 1){
    const g = rint(120, 260);
    state.treasury[state.player].food += g;
    addLog(name + ' 五穀豐登，糧 +' + g, 'good');
  } else if (roll === 2){
    const g = rint(100, 220);
    state.treasury[state.player].food = Math.max(0, state.treasury[state.player].food - g);
    addLog(name + ' 蝗災為患，糧 -' + g, 'bad');
  } else if (roll === 3){
    c.loy = clamp(c.loy - rint(6, 12), 0, 100);
    addLog(name + ' 民變四起，民忠下降', 'bad');
  } else if (roll === 4){
    const g = rint(100, 200);
    state.treasury[state.player].gold += g;
    addLog(name + ' 商賈雲集，金 +' + g, 'good');
  } else if (roll === 5){
    const loss = Math.round(c.troops * rnd(0.04, 0.09));
    c.troops = Math.max(0, c.troops - loss);
    addLog(name + ' 軍中疫病，折兵 ' + loss, 'bad');
  } else {
    c.loy = clamp(c.loy + rint(4, 8), 0, 100);
    addLog(name + ' 風調雨順，民心歸附', 'good');
  }
}

/* ==================== AI ==================== */
function aiTurn(){
  Object.keys(FACTIONS).forEach(f=>{
    if (f === 'none' || f === state.player || isDead(f)) return;

    // 內政
    factionCities(f).forEach(cid=>{
      if (Math.random() < 0.7) aiDevelop(cid, f);
    });

    // 兵力集結：內地城池把兵送往前線
    for (let k = 0; k < 3; k++){
      let any = false;
      factionCities(f).forEach(cid=>{
        const c = state.cities[cid];
        if (c.moved || c.troops < 7000) return;
        const adj = CITY_BY_ID[cid].adj;
        const hostile = adj.some(id=>{
          const o = state.cities[id].owner;
          return o !== f && (o === 'none' || state.rel[f][o] < 75);
        });
        if (hostile) return;
        const friend = adj.find(id=> state.cities[id].owner === f && !state.cities[id].moved);
        if (!friend) return;
        const n = Math.round((c.troops - 2000) * 0.85);
        if (n < 2000) return;
        c.troops -= n;
        state.cities[friend].troops += n;
        c.moved = true;
        any = true;
      });
      if (!any) break;
    }

    // 出征
    let guard = 0;
    while (guard++ < 2){
      const mv = findAiAttack(f);
      if (!mv) break;
      const res = resolveBattle(mv.from, mv.to, mv.gen, mv.troops);
      applyBattle(res);
      state.cities[mv.from].moved = true;
    }
  });
}

function aiDevelop(cid, f){
  const c = state.cities[cid];
  const t = state.treasury[f];
  if (c.acted) return;
  const opts = [];
  if (t.gold >= 120 && t.food > 150 && c.troops < 28000){ opts.push('recruit'); opts.push('recruit'); opts.push('recruit'); }
  if (t.gold >= 100 && c.def < 85) opts.push('fortify');
  if (t.gold >= 80) { opts.push('develop'); opts.push('commerce'); }
  if (t.gold >= 60 && c.loy < 70) opts.push('appease');
  if (!opts.length) return;

  const pick = opts[rint(0, opts.length - 1)];
  if (pick === 'recruit'){
    t.gold -= 120;
    c.troops += 3000;
    c.loy = clamp(c.loy - 4, 0, 100);
  } else if (pick === 'fortify'){
    t.gold -= 100; c.def = clamp(c.def + rint(3,6), 0, 100);
  } else if (pick === 'develop'){
    t.gold -= 80; c.agri = clamp(c.agri + rint(4,7), 0, 100);
  } else if (pick === 'commerce'){
    t.gold -= 80; c.comm = clamp(c.comm + rint(4,7), 0, 100);
  } else {
    t.gold -= 60; c.loy = clamp(c.loy + rint(5,9), 0, 100);
  }
  c.acted = true;
}

function findAiAttack(f){
  let best = null;
  factionCities(f).forEach(fromId=>{
    const from = state.cities[fromId];
    if (from.moved || from.troops < 6000) return;
    const adj = CITY_BY_ID[fromId].adj;
    adj.forEach(toId=>{
      const to = state.cities[toId];
      if (to.owner === f) return;
      if (state.rel[f][to.owner] >= 75) return; // 盟友不攻
      if (to.owner === state.player && state.rel[f][state.player] >= 75) return;
      const avail = from.troops - 1500;
      if (avail < 4000) return;
      const need = to.troops * (1.65 + to.def / 320);
      if (avail < need) return;
      const gen = bestGeneralIn(fromId);
      if (!gen) return;
      const score = avail - need;
      if (!best || score > best.score){
        best = {from: fromId, to: toId, gen: gen.id,
                troops: Math.round(avail * 0.9), score};
      }
    });
  });
  return best;
}

/* ==================== 勝負 ==================== */
function checkGameOver(){
  const p = state.player;
  if (isDead(p)){
    state.over = true;
    showEnd('失　勢', '城池盡失，霸業成空。', false);
    return;
  }
  const alive = Object.keys(FACTIONS).filter(f=> f !== 'none' && !isDead(f));
  const notMine = CITY_DEFS.filter(d=> state.cities[d.id].owner !== p).length;
  if (notMine === 0){
    state.over = true;
    showEnd('天　下', '四海歸一，霸業已成。', true);
  } else if (alive.length === 1 && alive[0] === p){
    state.over = true;
    showEnd('天　下', '群雄盡滅，天下已定。', true);
  }
}

/* ==================== 事件綁定 ==================== */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');

  if (act === 'pick'){
    sel = el.getAttribute('data-id');
    tab = 'city';
    document.querySelectorAll('.tabs button').forEach(b=> b.classList.remove('on'));
    document.querySelector('.tabs button[data-tab="city"]').classList.add('on');
    refresh();
    return;
  }

  if (act === 'start'){
    startGame(el.getAttribute('data-f'));
    return;
  }

  if (act === 'tab'){
    tab = el.getAttribute('data-tab');
    document.querySelectorAll('.tabs button').forEach(b=> b.classList.remove('on'));
    el.classList.add('on');
    renderSide();
    return;
  }

  if (act === 'endturn'){ endTurn(); return; }

  if (['develop','commerce','fortify','recruit','appease','drill'].indexOf(act) >= 0){
    doAction(act);
    return;
  }

  if (act === 'attack'){ openAttackModal(sel); return; }
  if (act === 'attack-from-adj'){ openAttackFromAdjacent(sel); return; }
  if (act === 'transfer'){ openTransferModal(sel); return; }
  if (act === 'confirmtransfer'){
    const fromId = el.getAttribute('data-from');
    const toId = document.getElementById('trTarget').value;
    const n = Number(document.getElementById('trTroops').value);
    document.getElementById('modalRoot').innerHTML = '';
    const from = state.cities[fromId];
    if (n > from.troops - 1000) return toast('兵力不足');
    from.troops -= n;
    state.cities[toId].troops += n;
    from.moved = true;
    addLog('自 ' + CITY_BY_ID[fromId].name + ' 調兵 ' + fmtT(n) + ' 至 ' + CITY_BY_ID[toId].name, '');
    refresh();
    return;
  }
  if (act === 'choosefrom'){
    openAttackModal(el.getAttribute('data-from'), el.getAttribute('data-to'));
    return;
  }

  if (act === 'confirmattack'){
    const fromId = el.getAttribute('data-from');
    const toId = document.getElementById('atkTarget').value;
    const genId = document.getElementById('atkGen').value;
    const troops = Number(document.getElementById('atkTroops').value);
    const from = state.cities[fromId];
    if (!from || !state.cities[toId] || !state.generals[genId]) return;
    const send = clamp(troops, 1000, Math.max(1000, from.troops - 500));
    document.getElementById('modalRoot').innerHTML = '';
    const res = resolveBattle(fromId, toId, genId, send);
    applyBattle(res);
    state.cities[fromId].moved = true;
    showBattleResult(res);
    checkGameOver();
    refresh();
    return;
  }

  if (act === 'closemask'){
    document.getElementById('modalRoot').innerHTML = '';
    return;
  }

  if (act === 'setgov'){
    const v = document.getElementById('govSel').value;
    state.cities[sel].governor = v;
    addLog(CITY_BY_ID[sel].name + ' 任命 ' + state.generals[v].name + ' 為太守', '');
    refresh();
    return;
  }

  if (act === 'gift'){
    const f = el.getAttribute('data-f');
    const t = state.treasury[state.player];
    if (t.gold < 200) return toast('金不足');
    t.gold -= 200;
    state.rel[state.player][f] = clamp(state.rel[state.player][f] + 12, 0, 100);
    state.rel[f][state.player] = clamp(state.rel[f][state.player] + 10, 0, 100);
    addLog('遣使贈金於 ' + FACTIONS[f].name + '，關係改善', 'good');
    refresh();
    return;
  }

  if (act === 'ally'){
    const f = el.getAttribute('data-f');
    state.rel[state.player][f] = 100;
    state.rel[f][state.player] = 100;
    addLog('與 ' + FACTIONS[f].name + ' 結為同盟', 'good');
    refresh();
    return;
  }

  if (act === 'help'){ showHelp(); return; }
  if (act === 'restart'){ location.reload(); return; }
});

/* ==================== 啟動 ==================== */
function renderStart(){
  const list = document.getElementById('factionList');
  let h = '';
  ['cao','sun','yuan','liu','ma'].forEach(f=>{
    const fac = FACTIONS[f];
    const cities = CITY_DEFS.filter(d=> d.f === f).length;
    const troops = CITY_DEFS.filter(d=> d.f === f).reduce((s,d)=> s + d.troops, 0);
    const gens = GENERAL_DEFS.filter(g=> g.f === f).length;
    h += '<div class="fcard" data-act="start" data-f="'+f+'">';
    h += '<div class="fbar" style="background:'+fac.color+'"></div>';
    h += '<div class="fname" style="color:'+fac.color+'">'+fac.name+'</div>';
    h += '<div class="fseat">據 '+fac.seat+'</div>';
    h += '<div class="finfo">城池 '+cities+'　武將 '+gens+'<br>兵力 '+fmtT(troops)+'</div>';
    h += '<div class="fdiff" style="color:'+fac.diffColor+'">'+fac.diff+'</div>';
    h += '</div>';
  });
  list.innerHTML = h;
}

function startGame(f){
  state = buildState(f);
  sel = null;
  CITY_DEFS.forEach(d=>{ if (d.f === f && d.name === FACTIONS[f].seat) sel = d.id; });
  if (!sel) sel = factionCities(f)[0];
  tab = 'city';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  addLog('建安年間，' + FACTIONS[f].name + ' 起兵，志在天下。', 'turn');
  refresh();
}

renderStart();

// 供除錯與數值檢視用（不影響遊戲）
window.SGZ = { get state(){ return state; }, CITY_BY_ID: CITY_BY_ID, FACTIONS: FACTIONS };
})();
</script>
<script>setTimeout(function(){var e=document.querySelector('[data-f="liu"]'); if(e)e.click();},80);</script>
